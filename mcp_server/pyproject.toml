[project]
name = "sts2-ai-agent-mcp"
version = "0.16.1"
description = "FastMCP wrapper for the local STS2 AI Agent mod"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.0,<4.0.0",
    # Imported directly: server.py types its tool arguments with Annotated[..., Field(...)] so the
    # per-argument contract lands in each tool's inputSchema, where an MCP client renders it.
    "pydantic>=2,<3",
]

[project.scripts]
sts2-mcp-server = "sts2_mcp.server:main"
sts2-network-mcp-server = "sts2_mcp.network_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts2_mcp"]

[tool.uv]
package = true
